; Dynamic Pickpocket Loot - editable item pools
; Installed at Data/SKSE/Plugins/DynamicPickpocketLoot.ini
; This file REPLACES the built-in item list. Remove/comment a line to stop its generation.
; If this file is missing or unreadable, built-in vanilla defaults are used.
; If this readable file contains no usable entries, only coins will be generated.
; Restart Skyrim after edits. Existing generated NPCs wait for a victim-timer refresh or genuine inventory reset.
;
; Format under a category section:
; PluginFilename.ext|LocalHexFormID = MinimumWealth, ChildSafe, PrisonerSafe
; Wealth: Destitute, Poor, Common, Comfortable, Wealthy, Noble
; Safety flags: true/false (or 1/0). Use false, false for most custom items.
; Local IDs: omit load-order prefixes; ESL/light plugins use their local 000-FFF ID.
; Use the plugin that DEFINES the form, not an override plugin. Case is ignored.
; Last valid definition of a resolved form wins; duplicate lines do not add weight.
; Budgets and quantities are unchanged. A category chance does not guarantee an item.
; Keep user edits backed up when updating. No in-game configuration menu.
;
; Modded examples (commented out; replace placeholder filenames and IDs):
; [Jewelry]
; MyJewelry.esp|0x000812 = Comfortable, false, false
; [Potion]
; MyPotions.esl|0x000801 = Common, false, false
;

